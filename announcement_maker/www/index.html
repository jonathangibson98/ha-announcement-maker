<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Announcement Maker</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1c1c1a;--mu:#6b6b66;--bd:#dcdcd6;--ac:#d4501e;--ac2:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--tx:#f0efe9;--mu:#9a9a92;--bd:#34342f;--ac:#ff7a45;--ac2:#141413}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 0 10px}
label{display:block;font-size:14px;margin:8px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:60px;resize:vertical}
.chips,.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
button{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0;margin:0;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:460px){.grid{grid-template-columns:1fr}}
pre{background:#16181d;color:#d8e1ee;border-radius:10px;padding:12px;margin:0;overflow:auto;font:12px/1.45 ui-monospace,monospace;max-height:380px}
.mu{color:var(--mu);font-size:14px}
.warn{color:var(--ac);font-size:14px;margin:0 0 10px}
.saved{display:flex;gap:6px;align-items:center;margin:4px 0}.saved span{flex:1}
</style></head><body><main>
<h1>📣 Announcement Maker</h1>
<p class="warn" id="warn"></p>
<section><h2>Start from</h2><div class="chips" id="presets"></div></section>
<section><h2>Script name</h2><input type="text" id="name" value="Weather and News"></section>
<section><h2>What's in it</h2><div class="grid" id="srcs"></div></section>
<section><h2>Personality</h2>
<div id="selwrap"><label class="chk"><input type="checkbox" id="usePers"> Follow my personality dropdown in Home Assistant</label></div>
<div id="onewrap"><label>Always use</label><select id="one"><option>Hype</option><option>Roast</option><option>Sweetie Pie</option></select></div>
<div id="persbox"></div>
<label>Max length (characters)</label><input type="number" id="len" min="200" step="100">
<label>Extra instructions (optional)</label><textarea id="extra" placeholder="e.g. If it's the weekend, ask if anyone is coming over."></textarea>
<label class="chk"><input type="checkbox" id="json"> Also send a short banner to phones (needs notify targets in add-on options)</label>
</section>
<section><h2>Volume</h2>
<label>Speaker volume: <b id="volv"></b>%</label><input type="range" id="vol" min="10" max="100" style="width:100%">
<label class="chk"><input type="checkbox" id="pause" checked> Pause music while talking, resume after</label></section>
<section><h2>Your script</h2><pre id="out"></pre>
<div class="row"><button class="p" id="push">Push to Home Assistant</button><button id="run">Run it now</button><button id="copy">Copy YAML</button><button id="save">Save setup</button></div>
<p class="mu" id="msg"></p></section>
<section><h2>Saved setups</h2><div id="saved"></div></section>
</main>
<script>
const $=id=>document.getElementById(id),q=s=>[...document.querySelectorAll(s)];
let O={};
const ind=(t,n)=>t.split('\n').map(l=>l?' '.repeat(n)+l:l).join('\n');
const slug=s=>(s||'announcement').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'announcement';
const PRE={'Weather & News':['Weather and News',['household','locations','weather','news']],'Welcome Home':['Welcome Home',['household','locations','calendar','todo','trash']],"You're Late":["You're Late",['household','locations']],'Blank':['My Announcement',['household']]};

function sources(){
 const L=[['household','Household & friends info'],['locations','Where everybody is']];
 if(O.weather_entity)L.push(['weather','Weather + tomorrow']);
 if(O.news_entity)L.push(['news','News headlines']);
 if((O.calendar_entities||[]).length)L.push(['calendar','Calendar (7 days)']);
 if(O.todo_entity)L.push(['todo','To-do list']);
 if(O.trash_entity)L.push(['trash','Trash day reminder']);
 (O.custom_sources||[]).forEach((c,i)=>L.push(['c'+i,c.label]));
 return L;
}
function chk(parent,attr,key,label,on){const l=document.createElement('label');l.className='chk';const i=document.createElement('input');i.type='checkbox';i.dataset[attr]=key;i.checked=!!on;l.append(i,' '+label);parent.appendChild(l)}

function init(){
 const miss=['ai_task_entity','tts_entity','speaker'].filter(k=>!O[k]);
 if(miss.length)$('warn').textContent='Set these in the add-on Configuration tab first: '+miss.join(', ');
 sources().forEach(([k,l])=>chk($('srcs'),'s',k,l,k==='household'));
 [['Hype','hype_style'],['Roast','roast_style'],['Sweetie Pie','sweet_style']].forEach(([k,o])=>{
  const l=document.createElement('label');l.textContent=k+' style';const t=document.createElement('textarea');t.dataset.p=k;t.value=O[o]||'';$('persbox').append(l,t)});
 const hasSel=!!O.personality_select;
 $('selwrap').style.display=hasSel?'':'none';$('usePers').checked=hasSel;
 $('len').value=O.default_length||1000;$('vol').value=O.default_volume||70;
 Object.entries(PRE).forEach(([k,[n,s]])=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{$('name').value=n;q('[data-s]').forEach(c=>c.checked=s.includes(c.dataset.s));$('json').checked=k==='Welcome Home'&&(O.notify_targets||[]).length>0;gen()};$('presets').appendChild(b)});
 try{mem=JSON.parse(localStorage.getItem('ann')||'{}')}catch(e){}
 renderSaved();gen();
}

function st(){return{name:$('name').value,src:q('[data-s]:checked').map(c=>c.dataset.s),pers:Object.fromEntries(q('[data-p]').map(t=>[t.dataset.p,t.value])),usePers:$('usePers').checked&&!!O.personality_select,one:$('one').value,len:+$('len').value||1000,extra:$('extra').value.trim(),json:$('json').checked,vol:+$('vol').value/100,pause:$('pause').checked}}

function instr(s,rules){
 const has=x=>s.src.includes(x),L=[],W=O.weather_entity;
 L.push("Current time: {{ current_time }}. Use this to understand what 'tonight', 'this morning', 'Friday' etc. mean.");
 if(has('household')&&(O.household_context||O.combined_info_entity))L.push('Info about us and our friends: {{ combined_info }}');
 if(has('locations'))L.push(O.locations_entity?"Everyone's current location: {% for name, loc in locations.items() if name != 'friendly_name' %}{{ name }} is at {{ loc }}. {% endfor %}\nA location of Home means they are at our house.":"Where everyone is: {% for p in states.person %}{{ p.name }} is {{ p.state }}. {% endfor %}");
 if(has('weather'))L.push(`WEATHER: Right now it is {{ states('${W}') }}, {{ state_attr('${W}', 'temperature') | float(0) | round(0) | int }} degrees, humidity {{ state_attr('${W}', 'humidity') | float(0) | round(0) | int }} percent, wind {{ state_attr('${W}', 'wind_speed') | float(0) | round(0) | int }}.\nTomorrow: {% set day = forecast_data['${W}']['forecast'][1] %}{{ day.condition | default('unknown') }}, high {{ day.temperature | default(0) | float(0) | round(0) | int }}, low {{ day.templow | default(0) | float(0) | round(0) | int }}, rain {{ day.precipitation | default(0) | float(0) | round(2) }}.`+(O.inside_temp_entity?`\nInside temp: {{ states('${O.inside_temp_entity}') | float(0) | round(0) | int }} degrees.`:''));
 if(has('news'))L.push(`NEWS (cover local first, then US, then world):\n{% for a in (state_attr('${O.news_entity}', 'entries') or [])[:25] %}- {{ a.title }}: {{ a.summary }}\n{% endfor %}`);
 if(has('calendar'))L.push("CALENDAR (next 7 days; if empty say nothing is planned):\n{% for cal, d in calendars.items() %}{% for e in d.events %}- {{ e.summary }}: {{ e.start }}\n{% endfor %}{% endfor %}");
 if(has('todo'))L.push(`TO-DO LIST:\n{% for item in items.get('${O.todo_entity}', {}).get('items', []) %}- {{ item.summary }}{% if item.get('due') %} (due {{ item.get('due') }}){% endif %}\n{% else %}Nothing on the list.\n{% endfor %}`);
 if(has('trash'))L.push(`TRASH: {{ 'Trash pickup is tomorrow, remind us to take it to the curb.' if is_state('${O.trash_entity}', 'on') else 'No trash pickup tomorrow, do not mention trash.' }}`);
 (O.custom_sources||[]).forEach((c,i)=>{if(has('c'+i))L.push(c.label+': '+(c.attribute?`{{ state_attr('${c.entity}', '${c.attribute}') }}`:`{{ states('${c.entity}') }} {{ states.${c.entity}.attributes | default('', true) }}`))});
 let t="STYLE: "+rules+"\nNo markdown, bullet points, quotation marks or emojis. Keep it under "+s.len+" characters. One continuous flowing monologue that sounds natural read aloud by text-to-speech.";
 if(s.extra)t+="\n"+s.extra;
 L.push(t);
 if(s.json)L.push('Output ONLY a JSON object, no code fences, no other text, exactly like this:\n{"speech": "the full monologue", "notification": "one short sentence banner under 100 characters"}');
 return L.join('\n\n');
}

function gen(){
 const s=st(),has=x=>s.src.includes(x),n=JSON.stringify(s.name||'Announcement'),A=O.speaker||'media_player.SET_ME',players=O.music_players||[],flag=O.talking_flag;
 let y='alias: '+n+"\ndescription: Made with Announcement Maker\nsequence:\n  - variables:\n      current_time: '{{ now().strftime(''%A, %B %-d %Y %-I:%M %p %Z'') }}'\n";
 if(has('household')&&(O.household_context||O.combined_info_entity)){
  const e=O.combined_info_entity,a=O.combined_info_attribute;
  const t=((O.household_context||'')+(e?' {{ '+(a?`state_attr('${e}', '${a}')`:`states('${e}')`)+' }}':'')).trim();
  y+="      combined_info: "+JSON.stringify(t)+"\n"}
 if(has('locations')&&O.locations_entity)y+=`      locations: '{{ states.${O.locations_entity}.attributes | default({}, true) }}'\n`;
 if(has('weather'))y+=`  - alias: Get daily forecast\n    action: weather.get_forecasts\n    target:\n      entity_id: ${O.weather_entity}\n    data:\n      type: daily\n    response_variable: forecast_data\n`;
 if(has('calendar'))y+="  - alias: Get calendar events\n    action: calendar.get_events\n    target:\n      entity_id:\n"+O.calendar_entities.map(c=>"        - "+c).join('\n')+"\n    data:\n      start_date_time: \"{{ now().strftime('%Y-%m-%d 00:00:00') }}\"\n      duration:\n        days: 7\n    response_variable: calendars\n";
 if(has('todo'))y+=`  - action: todo.get_items\n    target:\n      entity_id: ${O.todo_entity}\n    data:\n      status: needs_action\n    response_variable: items\n`;
 if(s.pause&&players.length)y+="  - alias: Pause music if playing\n    if:\n      - condition: state\n        entity_id:\n"+players.map(p=>"          - "+p).join('\n')+"\n        state: playing\n        match: any\n    then:\n      - action: media_player.media_pause\n        target:\n          entity_id: "+players[0]+"\n";
 if(flag)y+=`  - action: input_boolean.turn_on\n    target:\n      entity_id: ${flag}\n`;
 y+=`  - delay:\n      seconds: 3\n  - action: media_player.volume_set\n    target:\n      entity_id: ${A}\n    data:\n      volume_level: ${s.vol}\n`;
 const task=r=>"- action: ai_task.generate_data\n  data:\n    task_name: "+n+"\n    entity_id: "+(O.ai_task_entity||'ai_task.SET_ME')+"\n    instructions: |-\n"+ind(instr(s,r),6)+"\n  response_variable: announcement";
 if(s.usePers){
  y+="  - alias: Generate announcement\n    choose:\n";
  Object.keys(s.pers).forEach(k=>{y+=`      - conditions:\n          - condition: state\n            entity_id: ${O.personality_select}\n            state: ${JSON.stringify(k)}\n        sequence:\n`+ind(task(s.pers[k]),10)+"\n"});
 } else y+=ind(task(s.pers[s.one]),2)+"\n";
 const sp=s.json?"{{ (announcement.data | from_json).speech }}":"{{ announcement.data }}";
 y+=`  - variables:\n      speech: '${sp}'\n  - alias: Speak\n    parallel:\n      - action: tts.speak\n        target:\n          entity_id: ${O.tts_entity||'tts.SET_ME'}\n        data:\n          message: '{{ speech }}'\n          media_player_entity_id: ${A}\n`;
 const al=(O.alexa_targets||[]);
 if(al.length)y+="      - action: notify.alexa_media\n        data:\n          target:\n"+al.map(a=>"            - "+a).join('\n')+"\n          message: '{{ speech }}'\n          data:\n            type: tts\n";
 const nt=(O.notify_targets||[]);
 if(s.json&&nt.length)y+="      - action: notify.send_message\n        target:\n          entity_id:\n"+nt.map(a=>"            - "+a).join('\n')+"\n        data:\n          message: '{{ (announcement.data | from_json).notification }}'\n";
 y+=`  - delay:\n      seconds: 15\n  - wait_for_trigger:\n      - trigger: state\n        entity_id: ${A}\n        to:\n          - paused\n          - idle\n    timeout:\n      seconds: 120\n    continue_on_timeout: true\n  - delay:\n      seconds: 5\n`;
 if(flag)y+=`  - action: input_boolean.turn_off\n    target:\n      entity_id: ${flag}\n`;
 if(s.pause&&players.length)y+="  - if:\n      - condition: state\n        entity_id: "+players[0]+"\n        state: paused\n    then:\n      - action: media_player.media_play\n        target:\n          entity_id: "+players[0]+"\n";
 $('out').textContent=y;
 $('onewrap').style.display=s.usePers?'none':'block';$('volv').textContent=Math.round(s.vol*100);
}
document.addEventListener('input',gen);document.addEventListener('change',gen);

async function post(path){
 const r=await fetch('./api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:slug($('name').value),yaml:$('out').textContent})});
 return r.json();
}
$('push').onclick=async()=>{$('msg').textContent='Pushing...';try{const r=await post('push');$('msg').textContent=r.ok?'Done. Created '+r.entity+' in Home Assistant.':(r.detail||r.error)}catch(e){$('msg').textContent='Failed: '+e}};
$('run').onclick=async()=>{$('msg').textContent='Starting...';try{const r=await post('run');$('msg').textContent=r.ok?'Started. Push first if you changed anything.':r.detail}catch(e){$('msg').textContent='Failed: '+e}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('out').textContent);$('msg').textContent='Copied.'}catch(e){const r=document.createRange();r.selectNodeContents($('out'));getSelection().removeAllRanges();getSelection().addRange(r);$('msg').textContent='Selected. Press Copy on your device.'}};

let mem={};
const persist=()=>{try{localStorage.setItem('ann',JSON.stringify(mem))}catch(e){}};
function renderSaved(){
 const box=$('saved');box.innerHTML='';const k=Object.keys(mem);
 if(!k.length){box.innerHTML='<span class="mu">Nothing saved yet.</span>';return}
 k.forEach(n=>{const d=document.createElement('div');d.className='saved';d.innerHTML='<span></span><button>Load</button><button>x</button>';d.firstChild.textContent=n;
  d.children[1].onclick=()=>{const s=mem[n];$('name').value=s.name;q('[data-s]').forEach(c=>c.checked=s.src.includes(c.dataset.s));q('[data-p]').forEach(t=>t.value=s.pers[t.dataset.p]||t.value);$('usePers').checked=s.usePers;$('one').value=s.one;$('len').value=s.len;$('extra').value=s.extra;$('json').checked=s.json;$('vol').value=Math.round(s.vol*100);$('pause').checked=s.pause;gen()};
  d.children[2].onclick=()=>{delete mem[n];persist();renderSaved()};box.appendChild(d)});
}
$('save').onclick=()=>{const s=st();mem[s.name||'Untitled']=s;persist();renderSaved();$('msg').textContent='Saved.'};

fetch('./api/options').then(r=>r.json()).then(o=>{O=o;init()}).catch(e=>{$('warn').textContent='Could not load add-on options: '+e});
</script></body></html>
