name: Announcement Maker
version: "0.2.3"
slug: announcement_maker
description: Build AI-written voice announcements (weather, news, welcome home...) and push them to Home Assistant as scripts.
url: https://github.com/jonathangibson98/ha-announcement-maker
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:bullhorn
panel_title: Announcements
homeassistant_api: true
options:
  ha_token: ""
  ha_url: "http://homeassistant:8123"
  helper_ai_task_entity: ""
schema:
  ha_token: password?
  ha_url: str?
  helper_ai_task_entity: str?
